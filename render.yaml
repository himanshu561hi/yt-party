services:
  - type: web
    name: yt-party-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://yt-party-web3task.netlify.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
